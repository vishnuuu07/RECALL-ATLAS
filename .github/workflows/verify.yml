name: Verify fixed snapshot

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt "pydantic>=2.8" pytest
      - run: python scripts/verify_submission.py
      - run: python scripts/validate_data.py
      - run: python scripts/validate_sources.py
      - run: python -m pytest -q
